name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          accept-android-sdk-licenses: false

      - name: Accept licenses and install SDK packages
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "--- Instalado ---"
          ls -la $ANDROID_HOME/platforms/ || true
          ls -la $ANDROID_HOME/build-tools/ || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate release keystore
        run: |
          mkdir -p app
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias cfadmin \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass cfadmin123 -keypass cfadmin123 \
            -dname "CN=CFAdmin, OU=Dev, O=CFAdmin, L=Caracas, S=DC, C=VE"
          ls -la app/release.keystore

      - name: Build release APK
        run: |
          gradle assembleRelease --stacktrace --no-daemon 2>&1 | tee /tmp/gradle.log
          EXIT=${PIPESTATUS[0]}
          if [ $EXIT -ne 0 ]; then
            echo "=== Ultimas 100 lineas del log ==="
            tail -n 100 /tmp/gradle.log
            exit $EXIT
          fi

      - name: Locate and rename APK
        id: locate
        if: success()
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No se genero ningun APK"
            find app/build/outputs -type f || true
            exit 1
          fi
          echo "apk=$APK_PATH" >> $GITHUB_OUTPUT
          cp "$APK_PATH" app/build/outputs/apk/release/clon-de-cloudflare.apk
          ls -la app/build/outputs/apk/release/

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cf-admin-release
          path: app/build/outputs/apk/release/clon-de-cloudflare.apk
          if-no-files-found: error
          retention-days: 30
